{% extends 'base.html' %}
{% block title %}{{ note['title'] }}{% endblock %}
{% block content %}
<a class="back" href="{{ url_for('notes') }}">← All notes</a><article class="panel reading"><p class="eyebrow">YOUR NOTE</p><h1>{{ note['title'] }}</h1><div class="note-body">{{ note_content }}</div><div class="actions"><a class="button" href="{{ url_for('edit_note', note_id=note['id']) }}">Edit note</a><form method="post" action="{{ url_for('delete_note', note_id=note['id']) }}">{% if csrf_token is defined %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endif %}<button class="text-button danger">Delete note</button></form></div></article>
{% endblock %}
