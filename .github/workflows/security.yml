name: Review verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --upgrade pip
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python -m bandit -r secure labcore.py run.py
      - run: .venv/bin/python -m pip_audit -r requirements-dev.txt --no-deps --disable-pip --progress-spinner off
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
